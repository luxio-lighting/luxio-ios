name: Luxio
options:
  bundleIdPrefix: lighting.luxio
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_FILE: Luxio/Info.plist
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
targets:
  Luxio:
    type: application
    platform: iOS
    sources: [Luxio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lighting.luxio.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Luxio/Luxio-Bridging-Header.h
        MARKETING_VERSION: '0.1.53'
        CURRENT_PROJECT_VERSION: '54'
  LuxioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Luxio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lighting.luxio.uitests
        INFOPLIST_FILE: ''
        TEST_TARGET_NAME: Luxio
schemes:
  Luxio:
    build:
      targets:
        Luxio: all
    test:
      targets: [LuxioUITests]
